<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guardia Orbitale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen arcade cabinet, a 3:4 playfield centered on deep orbit blue, status strip below */
:root {
  --space: #0d1424;      /* page ground, deep orbit blue */
  --panel: #151f36;      /* cabinet bezel */
  --line: #2a3a5e;       /* bezel edge, grid */
  --ice: #9fe8ff;        /* player, UI accent */
  --amber: #ffb547;      /* low-tier swarm */
  --rose: #ff6f91;       /* mid-tier swarm */
  --lilac: #b79cff;      /* top-tier swarm */
  --text: #dbe6ff;
  --muted: #7f8fb5;
  --font-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --font-ui: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--space);
  color: var(--text);
  font-family: var(--font-ui);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
.wrap {
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
canvas {
  display: block;
  max-width: 100%;
  background: var(--space);
  border: 2px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 0 0 6px var(--panel), 0 18px 60px rgba(0, 0, 0, 0.5);
  cursor: crosshair;
}
canvas:focus-visible { outline: 2px solid var(--ice); outline-offset: 8px; }
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px 16px;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.bar kbd {
  font-family: var(--font-ui);
  font-weight: 600;
  color: var(--text);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 1px 6px;
  background: var(--panel);
}
.bar button {
  font: 600 12px var(--font-ui);
  color: var(--ice);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  cursor: pointer;
  letter-spacing: 0.06em;
}
.bar button:hover { border-color: var(--ice); }
.bar button:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.touch-only { display: none; }
@media (pointer: coarse) {
  .touch-only { display: inline; }
  .key-only { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="game" tabindex="0" aria-label="Guardia Orbitale, area di gioco"></canvas>
  </div>
  <div class="bar">
    <span class="key-only"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> muovi</span>
    <span class="key-only"><kbd>Spazio</kbd> spara</span>
    <span class="key-only"><kbd>P</kbd> pausa</span>
    <span class="touch-only">Trascina il dito per muoverti, la nave spara da sola</span>
    <button type="button" id="pauseBtn">Pausa</button>
    <button type="button" id="muteBtn">Audio: on</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------- setup ----------
  const W = 480, H = 640;
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");
  const pauseBtn = document.getElementById("pauseBtn");
  const muteBtn = document.getElementById("muteBtn");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const css = getComputedStyle(document.documentElement);
  const C = {
    space: css.getPropertyValue("--space").trim() || "#0d1424",
    line: css.getPropertyValue("--line").trim() || "#2a3a5e",
    ice: css.getPropertyValue("--ice").trim() || "#9fe8ff",
    amber: css.getPropertyValue("--amber").trim() || "#ffb547",
    rose: css.getPropertyValue("--rose").trim() || "#ff6f91",
    lilac: css.getPropertyValue("--lilac").trim() || "#b79cff",
    text: css.getPropertyValue("--text").trim() || "#dbe6ff",
    muted: css.getPropertyValue("--muted").trim() || "#7f8fb5",
  };
  const FONT_D = '"Bungee", Impact, "Arial Black", sans-serif';
  const FONT_U = '"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';

  function resize() {
    const r = stage.getBoundingClientRect();
    const scale = Math.max(0.3, Math.min(r.width / W, r.height / H));
    const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = cw + "px";
    canvas.style.height = ch + "px";
    canvas.width = Math.floor(cw * dpr);
    canvas.height = Math.floor(ch * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };

  // ---------- audio ----------
  let actx = null;
  let muted = store.get("go-muted") === "1";
  muteBtn.textContent = muted ? "Audio: off" : "Audio: on";
  function beep(freq, dur, type = "square", vol = 0.06, slide = 0) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const t = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination);
      o.start(t);
      o.stop(t + dur);
    } catch (e) { /* audio unavailable */ }
  }
  const sfx = {
    shoot: () => beep(880, 0.08, "square", 0.04, -500),
    hit: () => beep(220, 0.12, "sawtooth", 0.06, -150),
    boom: () => beep(110, 0.4, "sawtooth", 0.09, -80),
    power: () => { beep(520, 0.08, "triangle", 0.07); setTimeout(() => beep(780, 0.12, "triangle", 0.07), 80); },
    comet: () => beep(1200, 0.2, "triangle", 0.05, -900),
    step: (n) => beep([98, 92, 87, 82][n % 4], 0.07, "triangle", 0.05),
  };

  // ---------- input ----------
  const keys = new Set();
  window.addEventListener("keydown", (e) => {
    if (["ArrowLeft", "ArrowRight", " ", "Spacebar", "ArrowUp", "ArrowDown"].includes(e.key)) e.preventDefault();
    keys.add(e.key.toLowerCase());
    if (e.key === "p" || e.key === "P" || e.key === "Escape") togglePause();
    if ((e.key === " " || e.key === "Enter") && (state === "title" || state === "over")) startGame();
  });
  window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
  window.addEventListener("blur", () => { keys.clear(); if (state === "play") togglePause(); });

  let pointer = { active: false, x: W / 2 };
  function toGame(e) {
    const r = canvas.getBoundingClientRect();
    return ((e.clientX - r.left) / r.width) * W;
  }
  canvas.addEventListener("pointerdown", (e) => {
    canvas.focus();
    if (state === "title" || state === "over") { startGame(); return; }
    if (state === "paused") { togglePause(); return; }
    pointer.active = true;
    pointer.x = toGame(e);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => { if (pointer.active) pointer.x = toGame(e); });
  const endPointer = () => { pointer.active = false; };
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);

  pauseBtn.addEventListener("click", () => { togglePause(); canvas.focus(); });
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    store.set("go-muted", muted ? "1" : "0");
    muteBtn.textContent = muted ? "Audio: off" : "Audio: on";
    canvas.focus();
  });

  // ---------- game state ----------
  let state = "title";
  let hiScore = parseInt(store.get("go-hiscore") || "0", 10) || 0;
  let score, lives, wave, player, bullets, enemyShots, enemies, formation, barriers,
      drops, comet, cometTimer, fireTimer, diveTimer, shake, banner, stepTick, stepN, time;
  let particles = [];

  const stars = Array.from({ length: 90 }, () => ({
    x: Math.random() * W, y: Math.random() * H, z: Math.random() * 0.8 + 0.2,
  }));

  const TIERS = {
    lilac: { pts: 30, color: C.lilac },
    rose: { pts: 20, color: C.rose },
    amber: { pts: 10, color: C.amber },
  };
  const ROWS = ["lilac", "rose", "rose", "amber", "amber"];
  const COLS = 9;
  const PLAYER_Y = H - 64;

  function startGame() {
    score = 0; lives = 3; wave = 0; time = 0;
    player = { x: W / 2, w: 34, h: 18, cool: 0, inv: 0, spread: 0, rapid: 0, bubble: false };
    particles = [];
    nextWave();
    state = "play";
    pauseBtn.textContent = "Pausa";
  }

  function nextWave() {
    wave++;
    bullets = []; enemyShots = []; drops = [];
    enemies = [];
    for (let r = 0; r < ROWS.length; r++) {
      for (let c = 0; c < COLS; c++) {
        enemies.push({ r, c, tier: ROWS[r], alive: true, mode: "slot", x: 0, y: 0, vx: 0, vy: 0, phase: Math.random() * 6 });
      }
    }
    formation = { x: 48, y: 96 + Math.min(wave - 1, 5) * 10, dir: 1, drop: 0 };
    if (wave === 1 || wave % 3 === 1) barriers = makeBarriers();
    comet = null;
    cometTimer = 14 + Math.random() * 10;
    fireTimer = 1.2;
    diveTimer = 6;
    stepTick = 0; stepN = 0;
    banner = { text: "Ondata " + wave, t: 1.8 };
  }

  function makeBarriers() {
    const list = [];
    const cell = 4, cols = 14, rows = 9;
    for (let b = 0; b < 4; b++) {
      const bx = 56 + b * 104, by = PLAYER_Y - 74;
      const cells = [];
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          // arched relay pylon: rounded top, notch at the base
          const dx = x - (cols - 1) / 2;
          const top = y < 3 && Math.abs(dx) > 4 + y;
          const notch = y > 5 && Math.abs(dx) < 3;
          if (!top && !notch) cells.push({ x: bx + x * cell, y: by + y * cell, hp: 2 });
        }
      }
      list.push({ cells, cell });
    }
    return list;
  }

  // ---------- helpers ----------
  const aliveEnemies = () => enemies.filter((e) => e.alive);
  function spacing() { return 40 + Math.sin(time * 1.6) * 3; } // the swarm "breathes"
  function slotPos(e) {
    const sp = spacing();
    return { x: formation.x + e.c * sp, y: formation.y + e.r * 34 };
  }
  function burst(x, y, color, n = 14, speed = 160) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = Math.random() * speed + 30;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, max: 0.9, color });
    }
  }
  function addShake(n) { if (!reduceMotion) shake = Math.max(shake || 0, n); }
  function hitBarrier(x, y, w, h, power) {
    for (const b of barriers) {
      for (let i = b.cells.length - 1; i >= 0; i--) {
        const c = b.cells[i];
        if (x < c.x + b.cell && x + w > c.x && y < c.y + b.cell && y + h > c.y) {
          c.hp -= power;
          if (c.hp <= 0) b.cells.splice(i, 1);
          // chip neighbours for a ragged hole
          for (let j = b.cells.length - 1; j >= 0; j--) {
            const d = b.cells[j];
            if (Math.abs(d.x - c.x) <= b.cell && Math.abs(d.y - c.y) <= b.cell && Math.random() < 0.35) b.cells.splice(j, 1);
          }
          burst(c.x + 2, c.y + 2, C.line, 4, 60);
          return true;
        }
      }
    }
    return false;
  }

  function togglePause() {
    if (state === "play") { state = "paused"; pauseBtn.textContent = "Riprendi"; }
    else if (state === "paused") { state = "play"; pauseBtn.textContent = "Pausa"; }
  }

  function loseLife() {
    if (player.bubble) {
      player.bubble = false;
      player.inv = 1;
      burst(player.x, PLAYER_Y, C.ice, 18);
      sfx.hit();
      return;
    }
    lives--;
    burst(player.x, PLAYER_Y, C.ice, 40, 240);
    addShake(10);
    sfx.boom();
    player.inv = 2.2;
    player.spread = 0; player.rapid = 0;
    enemyShots = [];
    if (lives <= 0) gameOver();
  }

  function gameOver() {
    state = "over";
    if (score > hiScore) { hiScore = score; store.set("go-hiscore", String(hiScore)); }
  }

  // ---------- update ----------
  function update(dt) {
    time += dt;
    for (const s of stars) { s.y += s.z * 18 * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
    updateParticles(dt);
    if (state !== "play") return;
    if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }

    // player
    const spd = 260;
    let move = 0;
    if (keys.has("arrowleft") || keys.has("a")) move -= 1;
    if (keys.has("arrowright") || keys.has("d")) move += 1;
    if (pointer.active) {
      const d = pointer.x - player.x;
      player.x += Math.sign(d) * Math.min(Math.abs(d), spd * 1.4 * dt);
    } else {
      player.x += move * spd * dt;
    }
    player.x = Math.max(24, Math.min(W - 24, player.x));
    player.cool -= dt;
    player.inv = Math.max(0, player.inv - dt);
    player.spread = Math.max(0, player.spread - dt);
    player.rapid = Math.max(0, player.rapid - dt);

    const wantFire = keys.has(" ") || keys.has("spacebar") || keys.has("arrowup") || keys.has("w") || pointer.active;
    if (wantFire && player.cool <= 0) {
      const y = PLAYER_Y - 14;
      bullets.push({ x: player.x, y, vx: 0 });
      if (player.spread > 0) {
        bullets.push({ x: player.x - 6, y, vx: -90 });
        bullets.push({ x: player.x + 6, y, vx: 90 });
      }
      player.cool = player.rapid > 0 ? 0.14 : 0.36;
      sfx.shoot();
    }

    // player bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.y -= 560 * dt; b.x += b.vx * dt;
      let gone = b.y < -10 || hitBarrier(b.x - 1, b.y - 6, 3, 10, 1);
      if (!gone) {
        for (const e of enemies) {
          if (!e.alive) continue;
          if (Math.abs(b.x - e.x) < 15 && Math.abs(b.y - e.y) < 13) {
            killEnemy(e);
            gone = true;
            break;
          }
        }
      }
      if (!gone && comet && Math.abs(b.x - comet.x) < 22 && Math.abs(b.y - comet.y) < 10) {
        const pts = [50, 100, 150, 300][Math.floor(Math.random() * 4)];
        score += pts;
        burst(comet.x, comet.y, C.text, 30, 220);
        particles.push({ x: comet.x, y: comet.y, vx: 0, vy: -30, life: 1.2, max: 1.2, text: "+" + pts, color: C.text });
        sfx.boom();
        comet = null;
        gone = true;
      }
      if (gone) bullets.splice(i, 1);
    }

    updateSwarm(dt);
    updateEnemyFire(dt);
    updateDrops(dt);
    updateComet(dt);

    if (shake) shake = Math.max(0, shake - dt * 30);

    if (aliveEnemies().length === 0 && state === "play") {
      score += 100 * wave;
      nextWave();
    }
  }

  function killEnemy(e) {
    e.alive = false;
    const tier = TIERS[e.tier];
    const bonus = e.mode === "dive" ? 2 : 1;
    score += tier.pts * bonus;
    if (bonus > 1) particles.push({ x: e.x, y: e.y, vx: 0, vy: -40, life: 0.9, max: 0.9, text: "x2", color: tier.color });
    burst(e.x, e.y, tier.color);
    addShake(3);
    sfx.hit();
    if (Math.random() < 0.07) {
      const kinds = ["S", "R", "B"];
      drops.push({ x: e.x, y: e.y, kind: kinds[Math.floor(Math.random() * kinds.length)] });
    }
  }

  function updateSwarm(dt) {
    const alive = aliveEnemies();
    const total = ROWS.length * COLS;
    const pace = 18 + wave * 5 + (1 - alive.length / total) * 70;
    formation.x += formation.dir * pace * dt;

    // edge check uses the slots still occupied
    let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const e of alive) {
      if (e.mode !== "slot") continue;
      const p = slotPos(e);
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
    }
    if (maxX > W - 22 && formation.dir > 0) { formation.dir = -1; formation.y += 14; }
    if (minX < 22 && formation.dir < 0) { formation.dir = 1; formation.y += 14; }

    // march rhythm speeds up with pace
    stepTick -= dt;
    if (stepTick <= 0) { sfx.step(stepN++); stepTick = Math.max(0.12, 0.9 - pace / 140); }

    // dives start from wave 2
    if (wave >= 2) {
      diveTimer -= dt;
      if (diveTimer <= 0) {
        const pool = alive.filter((e) => e.mode === "slot");
        if (pool.length) {
          const e = pool[Math.floor(Math.random() * pool.length)];
          e.mode = "dive";
          e.vy = 120 + wave * 8;
          e.vx = 0;
        }
        diveTimer = Math.max(1.6, 5.5 - wave * 0.4) + Math.random() * 2;
      }
    }

    for (const e of alive) {
      if (e.mode === "slot") {
        const p = slotPos(e);
        e.x = p.x; e.y = p.y;
      } else if (e.mode === "dive") {
        e.phase += dt * 4;
        e.vx += (player.x - e.x) * 0.9 * dt;
        e.vx *= 0.985;
        e.x += (e.vx + Math.sin(e.phase) * 90) * dt;
        e.y += e.vy * dt;
        if (e.y > H + 20) { e.mode = "return"; e.y = -20; }
      } else if (e.mode === "return") {
        const p = slotPos(e);
        const dx = p.x - e.x, dy = p.y - e.y;
        const d = Math.hypot(dx, dy);
        if (d < 4) { e.mode = "slot"; }
        else { const s = Math.min(d, 220 * dt); e.x += (dx / d) * s; e.y += (dy / d) * s; }
      }
      // collisions with player
      if (player.inv <= 0 && Math.abs(e.x - player.x) < 24 && Math.abs(e.y - PLAYER_Y) < 18) {
        e.alive = false;
        burst(e.x, e.y, TIERS[e.tier].color);
        loseLife();
      }
      // swarm chews through barriers
      if (e.alive) hitBarrier(e.x - 14, e.y - 10, 28, 20, 2);
    }

    if (maxY > PLAYER_Y - 26) { lives = 0; burst(player.x, PLAYER_Y, C.ice, 40, 240); sfx.boom(); gameOver(); }
  }

  function updateEnemyFire(dt) {
    fireTimer -= dt;
    if (fireTimer <= 0) {
      // lowest swarm member in a random occupied column
      const byCol = {};
      for (const e of enemies) {
        if (!e.alive || e.mode !== "slot") continue;
        if (!byCol[e.c] || e.r > byCol[e.c].r) byCol[e.c] = e;
      }
      const shooters = Object.values(byCol);
      if (shooters.length) {
        // favour the column above the player
        shooters.sort((a, b) => Math.abs(a.x - player.x) - Math.abs(b.x - player.x));
        const pick = Math.random() < 0.45 ? shooters[0] : shooters[Math.floor(Math.random() * shooters.length)];
        enemyShots.push({ x: pick.x, y: pick.y + 12, vy: 170 + wave * 14, kind: pick.tier });
      }
      fireTimer = Math.max(0.35, 1.25 - wave * 0.08) * (0.6 + Math.random() * 0.8);
    }
    for (let i = enemyShots.length - 1; i >= 0; i--) {
      const s = enemyShots[i];
      s.y += s.vy * dt;
      let gone = s.y > H + 10 || hitBarrier(s.x - 2, s.y - 5, 4, 10, 1);
      if (!gone && player.inv <= 0 && Math.abs(s.x - player.x) < 16 && s.y > PLAYER_Y - 10 && s.y < PLAYER_Y + 10) {
        gone = true;
        loseLife();
      }
      if (!gone) {
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.abs(b.x - s.x) < 5 && Math.abs(b.y - s.y) < 10) {
            bullets.splice(j, 1);
            burst(s.x, s.y, C.text, 6, 80);
            gone = true;
            break;
          }
        }
      }
      if (gone) enemyShots.splice(i, 1);
    }
  }

  function updateDrops(dt) {
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.y += 90 * dt;
      if (Math.abs(d.x - player.x) < 22 && Math.abs(d.y - PLAYER_Y) < 18) {
        if (d.kind === "S") player.spread = 10;
        if (d.kind === "R") player.rapid = 10;
        if (d.kind === "B") player.bubble = true;
        const label = { S: "Triplo", R: "Rapido", B: "Scudo" }[d.kind];
        particles.push({ x: d.x, y: d.y - 10, vx: 0, vy: -40, life: 1, max: 1, text: label, color: C.ice });
        sfx.power();
        drops.splice(i, 1);
      } else if (d.y > H + 10) drops.splice(i, 1);
    }
  }

  function updateComet(dt) {
    if (!comet) {
      cometTimer -= dt;
      if (cometTimer <= 0) {
        const fromLeft = Math.random() < 0.5;
        comet = { x: fromLeft ? -30 : W + 30, y: 56, vx: fromLeft ? 110 : -110 };
        cometTimer = 18 + Math.random() * 12;
        sfx.comet();
      }
      return;
    }
    comet.x += comet.vx * dt;
    if (Math.random() < 0.6) particles.push({ x: comet.x - Math.sign(comet.vx) * 16, y: comet.y + (Math.random() - 0.5) * 6, vx: -comet.vx * 0.2, vy: 0, life: 0.4, max: 0.4, color: C.amber });
    if (comet.x < -40 || comet.x > W + 40) comet = null;
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (!p.text) { p.vx *= 0.96; p.vy *= 0.96; }
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ---------- drawing ----------
  function drawEnemy(e) {
    const col = TIERS[e.tier].color;
    const f = Math.floor(time * 3 + e.c) % 2; // two-frame wobble
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = col;
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    if (e.tier === "amber") {
      // hex drone with a single eye
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 6 + i * Math.PI / 3;
        ctx.lineTo(Math.cos(a) * 12, Math.sin(a) * 10);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = C.space;
      ctx.fillRect(-4 + (f ? 2 : -2), -3, 6, 6);
      ctx.fillStyle = col;
      ctx.fillRect(-14, 6 + f * 2, 4, 4);
      ctx.fillRect(10, 6 + (1 - f) * 2, 4, 4);
    } else if (e.tier === "rose") {
      // diamond seeker with swept antennae
      ctx.beginPath();
      ctx.moveTo(0, -11); ctx.lineTo(12, 0); ctx.lineTo(0, 11); ctx.lineTo(-12, 0);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-6, -6); ctx.lineTo(-12, f ? -14 : -12);
      ctx.moveTo(6, -6); ctx.lineTo(12, f ? -12 : -14);
      ctx.stroke();
      ctx.fillStyle = C.space;
      ctx.fillRect(-5, -2, 3, 4);
      ctx.fillRect(2, -2, 3, 4);
    } else {
      // ringed warden with orbiting motes
      ctx.beginPath();
      ctx.arc(0, 0, 9, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
      const a = time * 4 + e.c;
      for (let i = 0; i < 3; i++) {
        const t = a + i * (Math.PI * 2 / 3);
        ctx.fillRect(Math.cos(t) * 14 - 2, Math.sin(t) * 7 - 2, 4, 4);
      }
    }
    ctx.restore();
  }

  function drawPlayer() {
    if (player.inv > 0 && Math.floor(time * 12) % 2 === 0) return;
    ctx.save();
    ctx.translate(player.x, PLAYER_Y);
    ctx.fillStyle = C.ice;
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(6, -4); ctx.lineTo(17, 4); ctx.lineTo(17, 9);
    ctx.lineTo(-17, 9); ctx.lineTo(-17, 4); ctx.lineTo(-6, -4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = C.space;
    ctx.fillRect(-2, -6, 4, 6);
    // engine glow
    ctx.fillStyle = C.amber;
    ctx.globalAlpha = 0.6 + Math.sin(time * 30) * 0.3;
    ctx.fillRect(-10, 10, 5, 3 + Math.random() * 3);
    ctx.fillRect(5, 10, 5, 3 + Math.random() * 3);
    ctx.globalAlpha = 1;
    if (player.bubble) {
      ctx.strokeStyle = C.ice;
      ctx.globalAlpha = 0.5 + Math.sin(time * 6) * 0.2;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, 26, 20, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawShipIcon(x, y) {
    ctx.fillStyle = C.ice;
    ctx.beginPath();
    ctx.moveTo(x, y - 6); ctx.lineTo(x + 8, y + 4); ctx.lineTo(x - 8, y + 4);
    ctx.closePath();
    ctx.fill();
  }

  function text(str, x, y, size, color, font = FONT_U, align = "center", weight = "") {
    ctx.font = `${weight} ${size}px ${font}`.trim();
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = "middle";
    ctx.fillText(str, x, y);
  }

  function drawHUD() {
    text("PUNTI", 16, 20, 10, C.muted, FONT_U, "left", "600");
    text(String(score).padStart(6, "0"), 16, 36, 16, C.text, FONT_U, "left", "600");
    text("RECORD", W / 2, 20, 10, C.muted, FONT_U, "center", "600");
    text(String(Math.max(hiScore, score)).padStart(6, "0"), W / 2, 36, 16, C.text, FONT_U, "center", "600");
    text("ONDATA " + wave, W - 16, 20, 10, C.muted, FONT_U, "right", "600");
    for (let i = 0; i < lives; i++) drawShipIcon(W - 24 - i * 22, 36);

    // ground line and active power-ups
    ctx.fillStyle = C.line;
    ctx.fillRect(0, H - 34, W, 2);
    let px = 16;
    const tag = (label, t, color) => {
      text(label + (t ? " " + Math.ceil(t) + "s" : ""), px, H - 17, 11, color, FONT_U, "left", "600");
      px += 96;
    };
    if (player.spread > 0) tag("TRIPLO", player.spread, C.ice);
    if (player.rapid > 0) tag("RAPIDO", player.rapid, C.ice);
    if (player.bubble) tag("SCUDO", 0, C.ice);
  }

  function drawOverlay(title, lines, sub) {
    ctx.fillStyle = "rgba(13, 20, 36, 0.78)";
    ctx.fillRect(0, 0, W, H);
    text(title, W / 2, H / 2 - 90, 34, C.ice, FONT_D);
    lines.forEach((l, i) => text(l, W / 2, H / 2 - 40 + i * 22, 13, C.text));
    if (sub && Math.floor(time * 2) % 2 === 0) text(sub, W / 2, H / 2 + 120, 14, C.amber, FONT_U, "center", "600");
  }

  function drawTitle() {
    ctx.fillStyle = "rgba(13, 20, 36, 0.6)";
    ctx.fillRect(0, 0, W, H);
    text("GUARDIA", W / 2, 150, 46, C.ice, FONT_D);
    text("ORBITALE", W / 2, 200, 46, C.ice, FONT_D);
    text("Lo sciame scende verso i ripetitori.", W / 2, 250, 13, C.text);
    text("Tieni la linea, ondata dopo ondata.", W / 2, 270, 13, C.text);

    const demo = [
      { tier: "lilac", label: "Guardiano   30" },
      { tier: "rose", label: "Cercatore   20" },
      { tier: "amber", label: "Drone       10" },
    ];
    demo.forEach((d, i) => {
      drawEnemy({ tier: d.tier, x: W / 2 - 80, y: 330 + i * 40, c: i });
      text(d.label, W / 2 - 50, 330 + i * 40, 13, TIERS[d.tier].color, FONT_U, "left", "600");
    });
    text("Cometa  ???", W / 2 - 50, 450, 13, C.amber, FONT_U, "left", "600");
    ctx.fillStyle = C.amber;
    ctx.beginPath(); ctx.arc(W / 2 - 80, 450, 6, 0, Math.PI * 2); ctx.fill();
    text("Chi colpisci in picchiata vale doppio", W / 2, 490, 11, C.muted);

    const coarse = window.matchMedia("(pointer: coarse)").matches;
    if (Math.floor(time * 2) % 2 === 0) text(coarse ? "TOCCA PER INIZIARE" : "PREMI SPAZIO PER INIZIARE", W / 2, 540, 14, C.amber, FONT_U, "center", "600");
    if (hiScore) text("Record: " + hiScore, W / 2, 575, 12, C.muted);
  }

  function draw() {
    ctx.save();
    ctx.fillStyle = C.space;
    ctx.fillRect(0, 0, W, H);
    if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    for (const s of stars) {
      ctx.globalAlpha = s.z * 0.8;
      ctx.fillStyle = C.text;
      ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2);
    }
    ctx.globalAlpha = 1;

    if (state !== "title") {
      // barriers
      for (const b of barriers) {
        for (const c of b.cells) {
          ctx.fillStyle = c.hp > 1 ? "#4f6fa8" : C.line;
          ctx.fillRect(c.x, c.y, b.cell, b.cell);
        }
      }
      for (const e of enemies) if (e.alive) drawEnemy(e);
      if (comet) {
        ctx.fillStyle = C.amber;
        ctx.beginPath(); ctx.arc(comet.x, comet.y, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = C.text;
        ctx.beginPath(); ctx.arc(comet.x, comet.y, 3, 0, Math.PI * 2); ctx.fill();
      }
      if (lives > 0) drawPlayer();

      ctx.fillStyle = C.ice;
      for (const b of bullets) ctx.fillRect(b.x - 1.5, b.y - 7, 3, 12);
      for (const s of enemyShots) {
        ctx.fillStyle = TIERS[s.kind].color;
        const zig = Math.floor(s.y / 6) % 2 ? 2 : -2;
        ctx.fillRect(s.x - 2 + zig, s.y - 6, 4, 4);
        ctx.fillRect(s.x - 2 - zig, s.y - 2, 4, 4);
        ctx.fillRect(s.x - 2 + zig, s.y + 2, 4, 4);
      }
      for (const d of drops) {
        ctx.strokeStyle = C.ice; ctx.lineWidth = 2;
        ctx.strokeRect(d.x - 9, d.y - 9, 18, 18);
        text(d.kind === "B" ? "+" : d.kind, d.x, d.y + 1, 12, C.ice, FONT_U, "center", "600");
      }
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      if (p.text) text(p.text, p.x, p.y, 12, p.color, FONT_U, "center", "600");
      else { ctx.fillStyle = p.color; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (state === "title") { drawTitle(); return; }
    drawHUD();
    if (banner && state === "play") {
      ctx.globalAlpha = Math.min(1, banner.t);
      text(banner.text.toUpperCase(), W / 2, H / 2 + 40, 28, C.ice, FONT_D);
      ctx.globalAlpha = 1;
    }
    if (state === "paused") drawOverlay("PAUSA", ["Premi P o tocca lo schermo per riprendere"], "");
    if (state === "over") {
      const record = score >= hiScore && score > 0;
      drawOverlay("FINE PARTITA", [
        "Punti: " + score,
        "Ondata raggiunta: " + wave,
        record ? "Nuovo record!" : "Record: " + hiScore,
      ], window.matchMedia("(pointer: coarse)").matches ? "TOCCA PER RIGIOCARE" : "SPAZIO PER RIGIOCARE");
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  time = 0;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  requestAnimationFrame(frame);
  canvas.focus();
})();
</script>
</body>
</html>
